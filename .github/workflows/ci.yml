name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Use the interpreter setup-python provides; never download one (see the setup-python steps).
  UV_PYTHON_DOWNLOADS: never
  UV_VERSION: "0.9.24"
  # uv run must not re-resolve: the lockfile is the source of truth
  UV_FROZEN: "1"

jobs:
  backend-sqlite:
    name: Backend (SQLite) + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Python from the runner's tool cache: uv's own CPython download from GitHub releases
      # fails with 504 on hosted runners often enough to turn CI red on its own.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check src db main.py tests
      - name: Test suite
        run: uv run pytest -q

  backend-postgres:
    name: Backend (PostgreSQL 16) + schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_gate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mcp_gate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # tests/conftest.py switches every fixture to this database (it is wiped: schema per session,
      # tables truncated per test)
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mcp_gate_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Python from the runner's tool cache: uv's own CPython download from GitHub releases
      # fails with 504 on hosted runners often enough to turn CI red on its own.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen
      - name: Schema drift (Alembic migrations vs. models)
        run: uv run pytest -v tests/test_schema_drift.py
      - name: Test suite
        run: uv run pytest -q --ignore=tests/test_schema_drift.py

  frontend:
    name: Frontend (lint, test, build, committed bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # static/web is committed and served as-is: it must be exactly what the sources build to
      - name: Committed static/web matches the build
        working-directory: .
        run: |
          changes="$(git status --porcelain --untracked-files=all -- static/web frontend/package.json)"
          if [ -n "$changes" ]; then
            echo "::error::static/web is out of date. Run 'cd frontend && npm run build' and commit the result."
            echo "$changes"
            git diff --stat -- static/web
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      # Python from the runner's tool cache: uv's own CPython download from GitHub releases
      # fails with 504 on hosted runners often enough to turn CI red on its own.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Python (pip-audit on the locked runtime dependencies)
        run: |
          # UV_FROZEN (set above) already exports exactly the lockfile; --locked conflicts with it.
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip --strict
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: npm (production dependencies, high and above)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker-runtime:
    name: mcp-runtime image (build + smoke test as the runtime user)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t mcp-runtime:ci deploy/mcp-runtime
      # No --user override: the image's own USER is what the orchestrator runs BYO servers as
      - name: Runs as the unprivileged user
        run: test "$(docker run --rm mcp-runtime:ci id -u)" = "10001"
      - name: Tools on PATH
        run: |
          docker run --rm mcp-runtime:ci sh -euc '
            python --version
            python3 --version
            uv --version
            uvx --version
            node --version
            npx --version
            command -v supergateway
            command -v lsof
            command -v kill
          '
      - name: uvx runs a real package
        run: docker run --rm mcp-runtime:ci uvx pycowsay@0.0.0.2 "mcp-runtime ok"
