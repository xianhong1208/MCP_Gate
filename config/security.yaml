# MCP Gate configuration: rate limits, trusted proxies, cookies, allowed hosts and CORS
#
# The configuration is five files in this directory (database, oauth, identity, security, system), merged at
# startup; a key may be set in one file only. Environment variable syntax:
#   ${VAR_NAME}           required
#   ${VAR_NAME:-default}  optional, with a default value
# Sensitive and per-machine values (keys, passwords, URLs) come only from environment variables (.env); never write
# them here directly.

rate_limit:
  enabled: true
  requests_per_minute: 120
  requests_per_hour: 2000
  whitelist:
    - "127.0.0.1"
    - "localhost"
    - "::1"
  path_limits:
    "/oauth/token": 60
    "/oauth/register": 20
    "/oauth/authorize": 60            # may fetch a client metadata document
    "/api/session/login": 20
    "/api/session/setup": 5

security:
  trusted_proxies:
    - "127.0.0.1"
    - "::1"
  # Set to true when deploying over HTTPS
  secure_cookie: ${SECURE_COOKIE:-false}
  cookie_samesite: "${COOKIE_SAMESITE:-lax}"
  # Host names to answer to besides the OAUTH_ISSUER host, localhost and IP addresses (DNS-rebinding protection):
  # comma-separated, e.g. ALLOWED_HOSTS=mcp-gate,*.internal.example for container service names; "*" turns it off.
  allowed_hosts: "${ALLOWED_HOSTS:-}"

cors:
  # Origins (besides the console's own) allowed credentialed access to the admin API: comma-separated, e.g.
  # CORS_ALLOWED_ORIGINS=https://admin.example.com. Empty by default; the Vite dev server does not need an entry
  # (it proxies with the backend's own Origin, see frontend/vite.config.js).
  allowed_origins: "${CORS_ALLOWED_ORIGINS:-}"
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["Content-Type", "Authorization", "X-Requested-With", "X-Session-Binding"]
  allow_credentials: true
