# MCP Gate configuration file
#
# Environment variable syntax:
#   ${VAR_NAME}           required
#   ${VAR_NAME:-default}  optional, with a default value
# All sensitive values (keys, passwords) come only from environment variables; never write them here directly.

database:
  # Defaults to a single SQLite file (zero dependencies); for PostgreSQL set DATABASE_URL=postgresql://user:pwd@host/db
  url: "${DATABASE_URL:-sqlite:///data/mcp_gate.db}"
  echo: false
  pool_size: 5
  max_overflow: 10

# Usually no need to change: leaving port at 0 takes the port from OAUTH_ISSUER (4568 if none is given).
# Only a reverse proxy setup (issuer is a domain while the app actually binds another port) needs an explicit
# SERVER_PORT.
server:
  host: "${SERVER_HOST:-0.0.0.0}"
  port: ${SERVER_PORT:-0}

# Admin console login session (httpOnly cookie)
session:
  # Leave empty -> generated on first start and stored in secrets/secrets.json
  secret_key: "${SESSION_SECRET_KEY:-}"
  expire_hours: ${SESSION_EXPIRE_HOURS:-12}
  idle_timeout_minutes: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}

# OAuth 2.1 Authorization Server
oauth:
  # Written into the iss of every JWT and the /.well-known documents; for public deployments use the public URL
  issuer: "${OAUTH_ISSUER:-http://localhost:4568}"
  signing_key_bits: ${OAUTH_SIGNING_KEY_BITS:-2048}
  # OAuth access tokens only (PATs choose their own lifetime, up to pat_max_days); clients renew with refresh tokens
  access_expire_minutes: ${OAUTH_ACCESS_EXPIRE_MINUTES:-15}
  refresh_expire_days: ${OAUTH_REFRESH_EXPIRE_DAYS:-30}
  auth_code_ttl_seconds: 120
  # Whether dynamically registered (RFC 7591) clients are usable without review (the human consent page is the
  # real gate)
  dcr_auto_approve: ${OAUTH_DCR_AUTO_APPROVE:-true}
  pat_max_days: 365
  # Signing keys rotate on their own every N days (0 = only by hand); a new key is published in the JWKS this many
  # minutes before it starts signing, so resource servers have it cached first (#30)
  signing_key_rotation_days: ${OAUTH_SIGNING_KEY_ROTATION_DAYS:-90}
  signing_key_prepublish_minutes: ${OAUTH_SIGNING_KEY_PREPUBLISH_MINUTES:-1440}
  # Client ID Metadata Documents (MCP authorization 2026-07-28): a client may use an https URL as its client_id;
  # MCP Gate fetches the client's metadata from that URL instead of the client registering. DCR keeps working.
  cimd:
    enabled: ${OAUTH_CIMD_ENABLED:-true}
    # Whether a client first seen through its metadata document is usable without review (consent still applies)
    auto_approve: ${OAUTH_CIMD_AUTO_APPROVE:-true}
    # Trust policy: only client_id URLs on these hosts ("example.com", "*.example.com"); empty = any public host
    allowed_hosts: "${OAUTH_CIMD_ALLOWED_HOSTS:-}"
    # Development / intranet only: hosts whose document may be fetched from a private address (loopback only
    # while the issuer is on loopback). Every other host must resolve to public addresses.
    private_network_hosts: "${OAUTH_CIMD_PRIVATE_NETWORK_HOSTS:-}"
    fetch_timeout_seconds: 5
    max_document_bytes: 5120          # the draft recommends 5 KB
    cache_min_seconds: 60             # HTTP Cache-Control max-age is honoured within these bounds
    cache_max_seconds: 86400
    failure_backoff_seconds: 30       # a URL whose fetch failed is not fetched again for this long

# Admin console authentication
identity:
  local_enabled: true
  # Third-party login providers: filling in client_id / client_secret enables one
  # (callback is <issuer>/api/session/oauth/<provider>/callback)
  github:
    client_id: "${GITHUB_CLIENT_ID:-}"
    client_secret: "${GITHUB_CLIENT_SECRET:-}"
  google:
    client_id: "${GOOGLE_CLIENT_ID:-}"
    client_secret: "${GOOGLE_CLIENT_SECRET:-}"
  # Emails allowed to have an account auto-created on third-party login (YAML list; the email must be verified by
  # the provider). Empty list = only existing accounts (or an account with the same email, which is linked
  # automatically) can use third-party login.
  allowed_emails: []
  # Owner account created automatically on first start (only when both are set; otherwise create it on the /setup page)
  bootstrap_admin_email: "${ADMIN_EMAIL:-}"
  bootstrap_admin_password: "${ADMIN_PASSWORD:-}"

rate_limit:
  enabled: true
  requests_per_minute: 120
  requests_per_hour: 2000
  whitelist:
    - "127.0.0.1"
    - "localhost"
    - "::1"
  path_limits:
    "/oauth/token": 60
    "/oauth/register": 20
    "/oauth/authorize": 60            # may fetch a client metadata document
    "/api/session/login": 20
    "/api/session/setup": 5

security:
  trusted_proxies:
    - "127.0.0.1"
    - "::1"
  # Set to true when deploying over HTTPS
  secure_cookie: ${SECURE_COOKIE:-false}
  cookie_samesite: "${COOKIE_SAMESITE:-lax}"
  # Host names to answer to besides the OAUTH_ISSUER host, localhost and IP addresses (DNS-rebinding protection):
  # comma-separated, e.g. ALLOWED_HOSTS=mcp-gate,*.internal.example for container service names; "*" turns it off.
  allowed_hosts: "${ALLOWED_HOSTS:-}"

cors:
  # Origins (besides the console's own) allowed credentialed access to the admin API: comma-separated, e.g.
  # CORS_ALLOWED_ORIGINS=https://admin.example.com. Empty by default; the Vite dev server does not need an entry
  # (it proxies with the backend's own Origin, see frontend/vite.config.js).
  allowed_origins: "${CORS_ALLOWED_ORIGINS:-}"
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["Content-Type", "Authorization", "X-Requested-With", "X-Session-Binding"]
  allow_credentials: true

# Background jobs (run inside the server process)
scheduler:
  oauth_cleanup_hours: 6              # purge expired OAuth codes / requests / tokens and console sessions
  usage_retention_days: 30            # token events behind the dashboard statistics
  audit_retention_days: ${AUDIT_RETENTION_DAYS:-90}
  health_check_enabled: true
  health_check_seconds: ${HEALTH_CHECK_SECONDS:-30}
  health_check_concurrency: 8         # services checked at the same time
  health_check_timeout_seconds: 10    # a check taking longer counts as failed
  health_write_interval_minutes: 5    # an unchanged health status is rewritten at most this often

logging:
  level: "${LOG_LEVEL:-INFO}"
  format: "colorized"
  log_dir: "logs"
  rotation: "00:00"
  rotation_max_size: "50 MB"
  retention: "30 days"
  compression: "zip"
