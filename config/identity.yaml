# MCP Gate configuration: console sign-in (local, GitHub, Google), bootstrap admin and console session
#
# The configuration is five files in this directory (database, oauth, identity, security, system), merged at
# startup; a key may be set in one file only. Environment variable syntax:
#   ${VAR_NAME}           required
#   ${VAR_NAME:-default}  optional, with a default value
# Sensitive and per-machine values (keys, passwords, URLs) come only from environment variables (.env); never write
# them here directly.

# Admin console authentication
identity:
  local_enabled: true
  # Third-party login providers: filling in client_id / client_secret enables one
  # (callback is <issuer>/api/session/oauth/<provider>/callback)
  github:
    client_id: "${GITHUB_CLIENT_ID:-}"
    client_secret: "${GITHUB_CLIENT_SECRET:-}"
  google:
    client_id: "${GOOGLE_CLIENT_ID:-}"
    client_secret: "${GOOGLE_CLIENT_SECRET:-}"
  # Emails allowed to have an account auto-created on third-party login (YAML list; the email must be verified by
  # the provider). Empty list = only existing accounts (or an account with the same email, which is linked
  # automatically) can use third-party login.
  allowed_emails: []
  # Owner account created automatically on first start (only when both are set; otherwise create it on the /setup page)
  bootstrap_admin_email: "${ADMIN_EMAIL:-}"
  bootstrap_admin_password: "${ADMIN_PASSWORD:-}"

# Admin console login session (httpOnly cookie)
session:
  # Leave empty -> generated on first start and stored in secrets/secrets.json
  secret_key: "${SESSION_SECRET_KEY:-}"
  expire_hours: ${SESSION_EXPIRE_HOURS:-12}
  idle_timeout_minutes: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
